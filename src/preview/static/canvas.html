<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/_hub/canvas.css">
</head>
<body>
<div id="mat" aria-label="Design canvas">
  <canvas id="ruler-x" aria-hidden="true"></canvas>
  <canvas id="ruler-y" aria-hidden="true"></canvas>
  <div id="world"><svg id="links" aria-hidden="true"></svg></div>
  <div id="empty" hidden>
    <h2>Nothing on the canvas yet</h2>
    <p>Ask Claude to design something for this project, or describe it below and send it.</p>
  </div>
</div>

<header id="topbar">
  <a href="/" class="home" title="All projects" aria-label="All projects">
    <svg viewBox="0 0 20 20" width="18" height="18"><path d="M3 3h6v6H3zM11 3h6v6h-6zM3 11h6v6H3zM11 11h6v6h-6z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
  </a>
  <div class="title">
    <strong id="project-name">…</strong>
    <span id="design-system" class="ds"></span>
  </div>
  <div class="status" role="radiogroup" aria-label="Project status">
    <button data-status="draft" role="radio">Draft</button>
    <button data-status="review" role="radio">In review</button>
    <button data-status="ready" role="radio">Ready</button>
  </div>
</header>

<div id="rightbar">
  <div id="listening" class="listening" title=""><span class="dot"></span><span class="txt">Connecting…</span></div>
  <div class="zoom">
    <button id="zoom-out" title="Zoom out (−)" aria-label="Zoom out">−</button>
    <button id="zoom-level" title="Fit everything (Shift+1)">100%</button>
    <button id="zoom-in" title="Zoom in (+)" aria-label="Zoom in">+</button>
  </div>
  <button id="toggle-activity" class="pill" aria-expanded="false">Activity <span id="pending-count" class="count" hidden>0</span></button>
</div>

<div id="frame-tools" hidden role="toolbar" aria-label="Design actions">
  <div class="seg" role="radiogroup" aria-label="Viewport">
    <button data-vp="mobile" title="Mobile 390">
      <svg viewBox="0 0 16 16" width="14" height="14"><rect x="4.5" y="1.5" width="7" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <button data-vp="tablet" title="Tablet 820">
      <svg viewBox="0 0 16 16" width="14" height="14"><rect x="2.5" y="1.5" width="11" height="13" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <button data-vp="desktop" title="Desktop 1440">
      <svg viewBox="0 0 16 16" width="14" height="14"><rect x="1.5" y="2.5" width="13" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 14h5" stroke="currentColor" stroke-width="1.4"/></svg></button>
  </div>
  <span class="sep"></span>
  <button data-act="pick" title="Select an element to change (E)">Select element</button>
  <button data-act="interact" title="Click and scroll inside the design (double-click)">Interact</button>
  <button data-act="fit-height" title="Show the full page height">Full height</button>
  <span class="sep"></span>
  <button data-act="duplicate" title="Duplicate (Ctrl/Cmd+D)">Duplicate</button>
  <button data-act="favorite" title="Mark as the chosen design">Choose</button>
  <a data-act="open" target="_blank" rel="noopener" title="Open in a new tab">Open</a>
  <button data-act="delete" class="danger" title="Delete (Del)">Delete</button>
</div>

<aside id="activity" hidden aria-label="Activity">
  <section id="runner">
    <h3>Claude Code</h3>
    <label class="switch"><input type="checkbox" id="runner-enabled"> <span>Run Claude Code automatically when nobody is listening</span></label>
    <p class="req-meta" id="runner-note"></p>
    <div class="runner-head"><strong id="runner-title"></strong><button type="button" id="runner-stop" class="ghost danger-text" hidden>Stop</button></div>
    <ol id="runner-log" class="runner-log" aria-live="polite"></ol>
  </section>
  <section>
    <h3>Requests and replies</h3>
    <ol id="requests"></ol>
  </section>
  <section>
    <h3>Critiques</h3>
    <ol id="critiques"></ol>
  </section>
  <section>
    <h3>Design system</h3>
    <div id="ds-info"></div>
  </section>
</aside>

<form id="composer" autocomplete="off">
  <div class="target">
    <span id="target-chip" class="chip"></span>
    <button type="button" id="clear-element" class="chip-x" hidden aria-label="Clear selected element">×</button>
  </div>
  <textarea id="prompt" rows="1" placeholder="Describe a change, or a new design…" aria-label="Request for Claude"></textarea>
  <div class="actions">
    <button type="button" id="copy-prompt" class="ghost" title="Copy as a prompt to paste into Claude Code">Copy prompt</button>
    <label class="variations">
      <select id="var-count" aria-label="Number of variations"><option>2</option><option selected>3</option><option>4</option><option>5</option></select>
      <button type="button" id="send-variations" class="ghost">variations</button>
    </label>
    <button type="submit" id="send" class="primary">Send to Claude</button>
  </div>
</form>

<dialog id="md-dialog"><form method="dialog"><header><strong>DESIGN.md</strong><button aria-label="Close">×</button></header><pre id="md-text"></pre></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/_hub/canvas.js"></script>
</body>
</html>
